<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found · Open Engineering</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --ink: #18212b; --muted: #556270; --accent: #0b6b86; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1318; --ink: #e5eaf0; --muted: #9ba7b4; --accent: #4fc0dc; --accent-ink: #062530; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.02em; }
  p { margin: 0 0 22px; color: var(--muted); }
  a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 650; text-decoration: none; }
</style>
</head>
<body>
<script>
  /* Redirects: course codes in upper case (URLs are case-sensitive on GitHub Pages), and the dynamics
     modules' addresses from before they were grouped into courses (generated by scripts/courses.py). */
  (function () {
    var MOVED = {"curvilinear-motion": "ecor1034", "cylindrical-coordinates": "ecor1034", "work-and-energy": "ecor1034", "impulse-and-momentum": "ecor1034", "mass-moments-of-inertia": "maae2101", "angular-momentum": "maae2101"};
    var p = location.pathname, rest = location.search + location.hash, l = p.toLowerCase(), m;
    if ((m = /^\/([a-z0-9-]+)(\/.*)?$/.exec(p)) && MOVED[m[1]]) { location.replace('/' + MOVED[m[1]] + '/' + m[1] + (m[2] || '/') + rest); return; }
    if ((m = /^\/downloads\/([a-z0-9-]+)\.zip$/.exec(p)) && MOVED[m[1]]) { location.replace('/' + MOVED[m[1]] + '/downloads/' + m[1] + '.zip'); return; }
    if (l !== p && /^\/(ecor1034|maae2101|aero3002|race-vehicle-dynamics)(\/|$)/.test(l)) location.replace(l + rest);
  })();
</script>
  <main>
    <h1>Page not found</h1>
    <p>That page has moved or never existed. All the modules and courses are listed on the home page.</p>
    <a href="/">Go to openengineering.ca</a>
  </main>
</body>
</html>
